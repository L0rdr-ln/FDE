# Copy to ~/.config/fde/fde.toml. Every key is optional; changes apply while FDE runs
# (a file that does not parse is reported in the log and ignored).

[appearance]
theme = "aero"         # aero, frutiger-metro, eco, dorific, vector-flourish, aqua, or a file in ~/.config/fde/themes/NAME.toml (see docs/THEMES.md)
# accent, transparency, blur and gloss below override the theme's own values; leave them out to get the theme's
accent = "#4aa8ee"     # colour of the glass, #rrggbb
transparency = 0.46    # tint strength of window frames, 0 (clear) .. 1
blur = 3               # blur levels 1..6: softer but slower
gloss = 0.8            # gloss band on the title bar, 0 .. 1
performance = "auto"   # auto: "fast" when the graphics are software-drawn (a VM without 3D); "quality" or "fast" (one blur pass, no shadows, no wobble)
wobbly_windows = true  # windows bend and swing on springs while you drag them
minimize_effect = "lamp"   # "lamp" (poured into the task bar button, and out again) or "shrink"
style_apps = true         # write the theme's colours for GTK and Qt programs (only files marked fde-managed, or new ones)
bubbles = false           # soap bubbles drift up behind the windows (the screen then redraws all the time)
click_ripples = true      # a ring spreads from every click
open_effect = "unfold"      # "unfold" (rolls down from the title bar) or "pop" (fades in)
workspace_effect = "cube"   # "cube" (the desktop turns when you switch workspaces) or "none"
switcher_effect = "flip3d"  # Alt+Tab: "flip3d" (a turned stack of windows) or "strip" (small pictures in a row)
close_effect = "shatter"   # "shatter" (breaks like glass), "fold" (switched off like a television), "burn" (burns away) or "fade"
animations = true      # windows fade and grow in when they open and shrink into the task bar when minimized
cursor_theme = ""      # an XCursor theme (a folder with cursors/ in ~/.icons, /usr/share/icons ...); empty = $XCURSOR_THEME
cursor_size = 0        # pixels at scale 1; 0 = $XCURSOR_SIZE, else 24

[wallpaper]
path = ""              # a PNG, JPEG or WebP file; empty = the built-in sky
mode = "fill"          # fill (cover, crop) | fit (all of it, black bars) | stretch | center | tile

[music]
enabled = false        # background music from your own files, played by fde-music
path = ""              # a music file or a folder (mp3, ogg, flac, wav, m4a, aac, opus)
volume = 0.5           # 0 .. 1
shuffle = false

[input]
keyboard_layout = ""   # xkb layout, e.g. "de"; empty = system default
repeat_rate = 25
repeat_delay = 600

[shell]
polkit_agent = true    # start a graphical password prompt for programs that need admin rights (if one is installed)
remember_windows = true  # open each program's window where it was last closed (~/.local/state/fde/windows)
tiling_default = false   # every workspace starts in tiling mode (Alt+T switches one off or on)
hot_corner = false       # the pointer in the top left corner for a moment opens the overview (Super+Tab)
pinned = []           # programs with a button on the task bar even when not running: desktop file names, e.g. ["firefox", "org.gnome.Nautilus"] (or right-click a window's title bar: Pin to task bar)
terminal = "foot"
launcher = ""          # what the start orb runs when no applications are found
panel = true           # start the task bar with the session
autostart = []         # e.g. ["nm-applet", "foot"]

[session]
workspaces = 4         # virtual desktops, 1 .. 9
idle_lock_seconds = 0  # lock after this many idle seconds; 0 = never
dim_seconds = 300       # dim the screen after this many idle seconds; 0 = never (a video keeps it awake)
screen_off_seconds = 600 # black out the screen after this many idle seconds; 0 = never

# One block per monitor, named like the connector (see the log line "monitor DP-1 (...)").
# Without a block a monitor uses its preferred mode at scale 1, placed to the right of the others.
[outputs."DP-1"]
scale = 1.5            # physical pixels per logical pixel: 1, 1.25, 1.5, 2 ...
mode = "2560x1440@144" # empty = the monitor's preferred mode
x = 0                  # position in the shared space (in logical pixels); x and y go together
y = 0
enabled = true

[outputs."HDMI-A-1"]
scale = 1.0
x = 1707               # 2560 / 1.5, right of DP-1
y = 0

[display]
night_light = false            # warm the screen in the evening
night_light_temperature = 3800  # Kelvin: 6500 = no change, lower = warmer (1200 .. 6500)
night_light_from = "20:00"       # warm hours (empty = whenever it is on)
night_light_to = "07:00"

[security]
# programs (besides FDE's own) that may capture the screen, see and close other windows, lock the screen,
# and put overlays above everything / take the keyboard without a click (launchers);
# they must be installed in a system folder (/usr, /bin, /opt ...) owned by root. See SECURITY.md.
trusted_programs = ["grim", "wf-recorder", "wl-screenrec", "xdg-desktop-portal-wlr", "swaylock", "waylock", "obs", "waybar", "nwg-panel",
    "fuzzel", "wofi", "rofi", "tofi", "bemenu", "bemenu-run", "nwg-drawer", "wlogout", "mako", "dunst", "swaync"]
restrict = true

# Window rules: settings for windows of certain programs, applied when a window first shows its
# picture. A rule needs app_id (the program's app id; X11: its class) or title, `*` and `?` match
# anything, case does not matter. All rules that match apply, later ones win.
#
# [[rules]]
# app_id = "pavucontrol"
# float = true            # stays out of the tiling layout
# size = [700, 500]       # the program's own size, without the frame
# center = true           # in the middle of the monitor
#
# [[rules]]
# title = "*Picture-in-Picture*"
# on_top = true
# workspace = 3           # opens on workspace 3 (1 to 32)
#
# [[rules]]
# app_id = "org.gnome.Calculator"
# position = [40, 60]     # top left corner of the window with its frame, on the first monitor
# maximize = false
